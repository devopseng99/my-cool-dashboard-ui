server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 10.43.0.10 valid=30s ipv6=off;

    error_log /var/log/nginx/error.log warn;
    access_log off;

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/backend/ {
        set $backend_upstream http://cool-dashboard.cool-dashboard.svc.cluster.local:80;
        proxy_pass $backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ai/chat {
        set $ai_upstream https://gateway.ai.cloudflare.com/v1/9709bd1f498109e65ff5d1898fec15ee/g-cf-gw-01/workers-ai/@cf/meta/llama-3.1-8b-instruct;
        proxy_pass $ai_upstream;
        proxy_set_header Content-Type application/json;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    location ~ ^/tenants/(?!new|detail|index\.html)[^/]+/?$ {
        try_files /tenants/detail/index.html =404;
    }

    location ~ ^/chat/[^/]+/?$ {
        try_files /chat/thread/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
