replicaCount: 1

image:
  repository: cool-dashboard-ui
  tag: rev-1
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

nodeSelector:
  kubernetes.io/hostname: mgplcb05

resources:
  limits:
    memory: 128Mi
    cpu: 200m
  requests:
    memory: 64Mi
    cpu: 50m

env:
  API_BACKEND_URL: "http://cool-dashboard.cool-dashboard.svc.cluster.local:80"
  CF_AI_TOKEN: "placeholder"

dnsConfig:
  options:
    - name: ndots
      value: "2"
