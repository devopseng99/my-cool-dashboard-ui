replicaCount: 1

image:
  repository: docker.io/library/cool-dashboard-ui
  tag: rev-1
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

nodeSelector:
  kubernetes.io/hostname: mgplcb05

resources:
  limits:
    memory: 128Mi
    cpu: 100m
  requests:
    memory: 32Mi
    cpu: 1m

env:
  API_BACKEND_URL: "http://cool-dashboard.cool-dashboard.svc.cluster.local:80"
  CF_AI_TOKEN: "placeholder"

dnsConfig:
  options:
    - name: ndots
      value: "2"
